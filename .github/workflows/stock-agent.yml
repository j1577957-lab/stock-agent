# 這個檔案告訴 GitHub「什麼時候自動執行股票 Agent」。一般不需要修改。
name: 股票 Agent

on:
  schedule:
    # GitHub 用的是 UTC 時間（台灣時間 -8 小時）
    - cron: "*/15 0-7 * * 1-5"    # 台股：台灣 08:00–15:45，每 15 分鐘
    - cron: "*/15 12-22 * * 1-5"  # 美股：涵蓋夏令/冬令時間，每 15 分鐘
  workflow_dispatch:              # 允許在網頁上手動按「Run workflow」測試
    inputs:
      mode:
        description: "模式（auto 自動判斷，或 tw_pre / tw_intraday / tw_post / us_pre / us_intraday / us_post）"
        default: "auto"
      dry_run:
        description: "模擬模式（不呼叫 Claude、不花錢）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 判斷現在要做什麼
        id: gate
        run: python agent/clock.py "${{ github.event.inputs.mode }}"

      - name: 指揮站：策略技師作業中
        if: steps.gate.outputs.mode != 'none'
        run: |
          python agent/status.py busy stock "${{ steps.gate.outputs.mode }}"
          git config user.name "stock-agent-bot"
          git config user.email "stock-agent-bot@users.noreply.github.com"
          git add docs/status.json
          git diff --cached --quiet || (git commit -q -m "策略技師作業中" && (git pull --rebase -q || true) && git push -q) || true

      - name: 安裝套件
        if: steps.gate.outputs.mode != 'none'
        run: pip install -q -r requirements.txt

      - name: 執行股票 Agent
        if: steps.gate.outputs.mode != 'none'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          STATUS_MSG_FILE: ${{ runner.temp }}/stock_msg.txt
        run: python -m agent.main ${{ steps.gate.outputs.mode }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: 更新網頁資料＋策略技師設回待命
        if: always() && steps.gate.outputs.mode != 'none'
        run: |
          git config user.name "stock-agent-bot"
          git config user.email "stock-agent-bot@users.noreply.github.com"
          MSG=$(cat "$RUNNER_TEMP/stock_msg.txt" 2>/dev/null || echo "⚠️ ${{ steps.gate.outputs.mode }} 執行失敗，請到 GitHub Actions 查看")
          # 先把這次產生的資料存起來（爬蟲技師的 news.json 不動）
          mkdir -p "$RUNNER_TEMP/out"
          for f in docs/data/*.json; do [ "$(basename "$f")" = news.json ] || cp "$f" "$RUNNER_TEMP/out/"; done
          # 每次都從 GitHub 最新版本重做，避免和爬蟲技師、晨報同時更新時打架
          for i in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP"/out/*.json docs/data/ 2>/dev/null || true
            if [ -n "$MSG" ]; then python agent/status.py idle stock "$MSG"; else python agent/status.py idle stock; fi
            git add docs/data docs/status.json
            git diff --cached --quiet && exit 0
            git commit -q -m "更新資料 ${{ steps.gate.outputs.mode }}" && git push -q && exit 0
            sleep $((i * 4))
          done
          exit 1
