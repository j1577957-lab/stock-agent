<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>股票 Agent 指揮中心</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#2a313c; --text:#e6edf3; --muted:#8b949e;
    --up:#ff4d5e; --down:#2fbf71; --buy:#2fbf71; --wait:#e3b341; --no:#ff4d5e; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:22px;margin:0;letter-spacing:.5px}
  h2{font-size:16px;margin:28px 0 10px;color:var(--muted);font-weight:600}
  .meta{color:var(--muted);font-size:13px}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font:inherit}
  .tab.on{color:var(--text);border-color:var(--accent)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:13px}
  td:first-child,th:first-child{text-align:left}
  tr:last-child td{border-bottom:0}
  .scroll{overflow-x:auto}
  .up{color:var(--up)} .down{color:var(--down)}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
  .pill.go{border-color:var(--buy);color:var(--buy)}
  .note{font-size:12px;color:var(--muted);white-space:normal;text-align:left;min-width:180px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .card summary{cursor:pointer;list-style:none}
  .card summary::-webkit-details-marker{display:none}
  .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
  .v{font-weight:700;padding:2px 10px;border-radius:6px;font-size:13px;color:#0d1117}
  .v-買進{background:var(--buy)} .v-觀望{background:var(--wait)} .v-不買{background:var(--no)}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;margin:12px 0;font-size:14px}
  .kv b{color:var(--muted);font-weight:500;margin-right:6px}
  pre{white-space:pre-wrap;font:inherit;margin:8px 0 0;color:#c9d1d9}
  .empty{color:var(--muted);padding:16px}
  .foot{margin-top:30px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📈 股票 Agent 指揮中心</h1>
      <div class="meta">盤中每 15 分鐘初篩 → 分析 agent → 判斷 agent</div>
    </div>
    <div class="meta" id="updated">載入中…</div>
  </header>

  <h2>🔍 最新掃描</h2>
  <div class="tabs">
    <button class="tab on" data-m="tw">台股</button>
    <button class="tab" data-m="us">美股</button>
  </div>
  <div class="panel scroll"><div id="scan"></div></div>

  <h2>⚖️ 判斷 agent 結果</h2>
  <div id="signals"></div>

  <h2>📰 盤前 / 盤後報告</h2>
  <div id="reports"></div>

  <div class="foot">資料來源 Yahoo Finance（台股約延遲 15–20 分鐘）。所有內容為技術面情境分析，不構成投資建議。</div>
</div>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "";
const sign = n => n == null ? "-" : (n > 0 ? "+" : "") + n + "%";
let latest = {}, market = "tw";

async function get(name, def){
  try{ const r = await fetch("data/" + name + "?t=" + Date.now()); return r.ok ? await r.json() : def; }
  catch(e){ return def; }
}

function renderScan(){
  const box = document.getElementById("scan");
  const m = latest[market];
  if(!m){ box.innerHTML = '<div class="empty">還沒有資料，等第一次自動執行後就會出現。</div>'; return; }
  const phase = {pre:"盤前", intraday:"盤中", post:"盤後"}[m.mode.split("_")[1]] || "";
  document.getElementById("updated").textContent = "最後更新：" + m.time + "（" + phase + "）";
  const rows = m.stocks.map(s => s.error
    ? `<tr><td>${esc(s.name)}<br><span class="meta">${esc(s.symbol)}</span></td><td colspan="7" class="note">⚠️ ${esc(s.error)}</td></tr>`
    : `<tr>
      <td>${esc(s.name)}<br><span class="meta">${esc(s.symbol)}</span></td>
      <td class="${cls(s.change_pct)}">${s.price}</td>
      <td class="${cls(s.change_pct)}">${sign(s.change_pct)}</td>
      <td>${s.above_ma20_pct ?? "-"}%</td>
      <td>${s.rsi ?? "-"}</td>
      <td>${s.vol_ratio ?? "-"}x</td>
      <td><span class="pill ${s.candidate ? "go" : ""}">${s.candidate ? "★ " : ""}${s.score} 分</span></td>
      <td class="note">${s.blockers?.length ? "❌ " + esc(s.blockers.join("、")) : "✅ " + esc((s.reasons || []).join("、") || "無加分")}</td>
    </tr>`).join("");
  box.innerHTML = `<table><thead><tr><th>股票</th><th>價格</th><th>漲跌</th><th>離月線</th><th>RSI</th><th>量比</th><th>初篩</th><th style="text-align:left">說明</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderSignals(list){
  const box = document.getElementById("signals");
  if(!list.length){ box.innerHTML = '<div class="card empty">目前沒有股票通過初篩。</div>'; return; }
  box.innerHTML = list.slice(0, 40).map(s => { const j = s.judge || {}; return `
    <details class="card">
      <summary class="row">
        <span><span class="v v-${esc(j.verdict)}">${esc(j.verdict)}</span>
          <b style="margin-left:8px">${esc(s.name)}</b> <span class="meta">${esc(s.symbol)} · ${s.price}</span></span>
        <span class="meta">${esc(s.time)} · 信心 ${j.confidence ?? "-"}${s.dry_run ? " · 模擬" : ""}</span>
      </summary>
      <div style="margin-top:10px">${esc(j.summary)}</div>
      <div class="kv"><div><b>進場</b>${esc(j.entry)}</div><div><b>停損</b>${esc(j.stop_loss)}</div><div><b>目標</b>${esc(j.target)}</div></div>
      <div>✅ ${esc((j.reasons || []).join("；"))}</div>
      <div style="margin-top:4px">⚠️ ${esc((j.risks || []).join("；"))}</div>
      <pre>📝 ${esc(s.report)}</pre>
    </details>`; }).join("");
}

function renderReports(list){
  const box = document.getElementById("reports");
  if(!list.length){ box.innerHTML = '<div class="card empty">還沒有報告。</div>'; return; }
  box.innerHTML = list.slice(0, 20).map((r, i) => `
    <details class="card" ${i === 0 ? "open" : ""}>
      <summary class="row"><b>${esc(r.title)}</b>${r.dry_run ? '<span class="meta">模擬</span>' : ""}</summary>
      <pre>${esc(r.text)}</pre>
    </details>`).join("");
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  market = b.dataset.m; renderScan();
});

async function load(){
  latest = await get("latest.json", {});
  if(!latest.tw && latest.us) market = "us";
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.m === market));
  renderScan();
  renderSignals(await get("signals.json", []));
  renderReports(await get("reports.json", []));
}
load(); setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
