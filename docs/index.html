<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pit Garage 像素指揮站</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: isometric voxel pit garage on top, pixel-framed pit-wall console + radio below; single dark night look by choice */
:root{
  --bg:#0d0e12; --panel:#16181e; --panel2:#1d2028; --line:#343947;
  --ink:#eef0f3; --mute:#8d94a3; --amber:#f2c230; --red:#e0402c; --ok:#47e08c;
  --pixel:"DotGothic16","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
h1{font-family:var(--pixel);font-weight:400;font-size:clamp(22px,5.4vw,32px);margin:0;letter-spacing:.06em}
h1 span{color:var(--amber)}
.session{font-family:var(--pixel);font-size:13px;color:var(--mute)}
.session b{color:var(--ok);font-weight:400}
.px{background:var(--panel);box-shadow:0 0 0 2px var(--line),4px 4px 0 2px #000;border-radius:0}
.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1c2030,#0d0e12 75%)}
#cv{display:block;width:100%;height:auto;aspect-ratio:3/2;cursor:grab}
#cv:active{cursor:grabbing}
.nogl #cv,.nogl .lbl,.nogl .dog{display:none}
.nogl-msg{padding:40px 16px;text-align:center}
.lbl{position:absolute;transform:translate(-50%,-100%);font-family:var(--pixel);font-size:clamp(10px,1.9vw,13px);
  background:#0d0e12e6;color:var(--ink);border:2px solid var(--c);padding:1px 6px;white-space:nowrap;cursor:pointer;line-height:1.4}
.lbl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lbl.busy{background:var(--c);color:#0d0e12}
.lbl.off{opacity:.55;border-style:dashed}
.lbl.err{background:var(--red);border-color:var(--red);color:#0d0e12}
.lbl.warn{border-style:dashed;border-color:var(--amber)}
.lbl .tk{display:block;font-size:.82em;max-width:9.5em;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.lbl .tk:empty{display:none}
.dog{position:absolute;transform:translate(-50%,-90%);width:6%;height:7%;min-width:28px;min-height:22px;background:transparent;border:0;box-shadow:none;padding:0;cursor:pointer;color:var(--amber);font-family:var(--pixel);font-size:12px}
.dog:focus-visible{outline:2px dashed var(--amber)}
.lbl .sm{display:none}
@media (max-width:520px){.lbl .tk,.lbl .lg{display:none}.lbl .sm{display:inline}.lbl{padding:0 4px;font-size:10px}}
.stage{transition:background 2s}
.stage.night{background:radial-gradient(ellipse at 50% 40%,#151a2c,#07080b 75%)}
.stage.day{background:radial-gradient(ellipse at 50% 40%,#28304a,#10131a 75%)}
/* 賽道看板：開盤旗號＋今日統計 */
.strip{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--pixel);font-size:13px;color:var(--mute);padding:10px 14px}
.strip b{font-weight:400;color:var(--ink)}
.flag{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;box-shadow:inset -2px -2px 0 #0006}
.flag.g{background:var(--ok)} .flag.y{background:var(--amber)} .flag.n{background:#4a4f5c} .flag.r{background:var(--red)}
.strip .alert{color:var(--red)}
.sound{font-size:12px;padding:3px 8px;box-shadow:none}
.mech{cursor:pointer}
.mech:hover{background:var(--panel2)}
.st.error{color:var(--red)} .st.warn{color:var(--amber)}
/* 技師卡 */
.dt{display:grid;gap:8px;font-size:14px}
.dt h3{font-family:var(--pixel);font-weight:400;font-size:17px;margin:0;display:flex;align-items:center;gap:8px}
.dt dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.dt dt{color:var(--mute);font-size:12.5px}
.dt dd{margin:0;overflow-wrap:anywhere}
.dt .hist{font-family:var(--pixel);font-size:12.5px;display:grid;gap:4px;max-height:150px;overflow-y:auto;border-top:2px dotted var(--line);padding-top:8px}
.dt .hist p{margin:0;overflow-wrap:anywhere}
.dt button{justify-self:start;font-size:12.5px;padding:4px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.card{padding:14px;min-width:0}
.label{font-family:var(--pixel);font-size:13px;color:var(--amber);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.label span:last-child{color:var(--mute)}
textarea{width:100%;min-height:72px;resize:vertical;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:0;padding:10px;font:15px/1.5 var(--body)}
textarea:focus{outline:2px solid var(--amber);outline-offset:0}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font-family:var(--pixel);font-size:14px;border-radius:0;border:2px solid var(--line);background:var(--panel2);color:var(--ink);padding:8px 12px;cursor:pointer;box-shadow:2px 2px 0 #000}
button:active{transform:translate(2px,2px);box-shadow:none}
button.go{background:var(--amber);color:#0d0e12;border-color:var(--amber);flex:1}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-family:var(--body);font-size:12.5px;padding:5px 9px}
.mech{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:7px 0;border-bottom:2px dotted var(--line)}
.mech:last-child{border-bottom:0}
.sw{width:12px;height:12px;background:var(--c);box-shadow:inset -3px -3px 0 #0005}
.role{font-size:12px;color:var(--mute)}
.st{font-family:var(--pixel);font-size:12px}
.st.idle{color:var(--ok)} .st.busy{color:var(--amber)} .st.off{color:var(--mute)}
.radio{font-family:var(--pixel);font-size:13px;line-height:1.6;max-height:210px;overflow-y:auto;display:grid;gap:4px}
.radio p{margin:0;overflow-wrap:anywhere}
.radio .t{color:var(--mute)} .radio .who{color:var(--amber)} .radio .done{color:var(--ok)}
.note{font-size:12px;color:var(--mute);margin:0}
/* 股票看板（沿用原本的像素風元件） */
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button.on{background:var(--amber);color:#0d0e12;border-color:var(--amber)}
.stk{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.stk th{font-family:var(--pixel);font-weight:400;font-size:12px;color:var(--mute);text-align:right;padding:4px 6px;border-bottom:2px solid var(--line)}
.stk td{text-align:right;padding:6px;border-bottom:2px dotted var(--line);white-space:nowrap}
.stk th:first-child,.stk td:first-child{text-align:left}
.stk tr:last-child td{border-bottom:0}
.stk .sym{font-size:11px;color:var(--mute)}
.up{color:var(--red)} .dn{color:var(--ok)}
.tag{font-family:var(--pixel);font-size:12px}
.tag.go{color:var(--amber)}
.verdicts{display:grid;gap:6px;margin-top:12px;font-size:13.5px}
.verdicts p{margin:0;overflow-wrap:anywhere}
.vd{font-family:var(--pixel);padding:0 6px;color:#0d0e12}
.vd.買進{background:var(--ok)} .vd.觀望{background:var(--amber)} .vd.不買{background:var(--red)}
.more{display:inline-block;margin-top:10px;font-family:var(--pixel);font-size:13px;color:var(--amber)}
.tblwrap{overflow-x:auto}
/* 利多利空小欄位（和 CREW 狀態欄同大小） */
.ntabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.ntabs button{font-size:12px;padding:4px 9px}
.ntabs button.on{background:var(--amber);color:#0d0e12;border-color:var(--amber)}
.mood{font-family:var(--pixel);font-size:12px;color:var(--mute);margin:0 0 6px}
.nlist{max-height:228px;overflow-y:auto}
.nw{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:13.5px;padding:6px 0;border-bottom:2px dotted var(--line)}
.nw:last-child{border-bottom:0}
.nw a{color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.nw a:hover{color:var(--amber)}
.nt{font-family:var(--pixel);font-size:11px;padding:0 5px;border:2px solid currentColor;line-height:1.5;margin-top:1px}
.nt.bull{color:var(--red)} .nt.bear{color:var(--ok)}
.nt.strong.bull{background:var(--red);color:#0d0e12;border-color:var(--red)}
.nt.strong.bear{background:var(--ok);color:#0d0e12;border-color:var(--ok)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>PIT GARAGE <span>指揮站</span></h1>
    <div class="session">BOX 07 ・ 台北 <b id="clock">--:--</b> <button class="sound" id="sound" aria-pressed="false">音效 關</button> <button class="sound" id="shot">4K 截圖</button></div>
  </header>

  <div class="stage px" id="stage">
    <canvas id="cv" aria-label="3D 維修區：紅色 F1 賽車停在中央，技師作業時會走到車旁。可以左右拖曳轉動視角"></canvas>
  </div>
  <div class="strip px" id="strip" aria-live="polite"></div>

  <div class="grid">
    <div class="card px">
      <p class="label"><span>PIT WALL ・ 下達任務</span><span>MSG</span></p>
      <textarea id="task" aria-label="任務內容" placeholder="例如：幫我整理今天台股收盤重點"></textarea>
      <div class="chips" id="chips"></div>
      <div class="row">
        <button class="go" id="send">送出任務 ▶</button>
        <button id="clear">清除</button>
      </div>
    </div>
    <div class="card px">
      <p class="label"><span>CREW 狀態</span><span id="count"></span></p>
      <div id="roster"></div>
      <div id="detail" class="dt" hidden></div>
    </div>
  </div>

  <div class="grid">
    <div class="card px">
      <p class="label"><span>NEWS ・ 利多利空</span><span id="newsTime">--</span></p>
      <div class="ntabs" id="ntabs">
        <button class="on" data-m="tw">台股</button><button data-m="us">美股</button>
        <button class="on" data-f="all">多＋空</button><button data-f="bull">利多</button><button data-f="bear">利空</button>
      </div>
      <p class="mood" id="mood"></p>
      <div class="nlist" id="nlist"><p class="note">還沒有新聞，爬蟲技師每小時會出勤一次。</p></div>
    </div>
    <div class="card px">
      <p class="label"><span>TEAM RADIO ・ 通訊紀錄</span><span>CH 1</span></p>
      <div class="radio" id="radio" aria-live="polite"></div>
    </div>
  </div>
  <div class="card px">
    <p class="label"><span>STRATEGY ・ 股票看板</span><span id="stkTime">--</span></p>
    <div class="tabs"><button class="on" data-m="tw">台股</button><button data-m="us">美股</button></div>
    <div class="tblwrap" id="stkTable"><p class="note">還沒有資料，等策略技師第一次出勤。</p></div>
    <div class="verdicts" id="stkVerdicts"></div>
    <a class="more" href="stock.html">完整報告與盤前盤後 ›</a>
  </div>
  <p class="note">技師作業中會走到車旁；名牌變紅＝故障、虛線＝可能卡住。點技師或名牌看工作紀錄與下次出勤，左右拖曳可轉動視角。開盤時間未計入國定假日。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- 3D 引擎（three.js）：真正的立體畫面，照螢幕解析度原生渲染，4K 螢幕也清晰 ----------
   座標：沿用舊版格子（1 格 = 0.18 公尺）。x 往維修道、y（3D 裡的 z）往畫面前方。 */
const CELL=0.18;
const cv=document.getElementById("cv"), stage=document.getElementById("stage");
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
const coarse=matchMedia("(pointer: coarse)").matches;
function skyMode(){const h=+new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Taipei",hourCycle:"h23",hour:"2-digit"}).format(new Date());
  return h>=6&&h<17?"day":h>=17&&h<19?"dusk":"night"}

/* ---------- crew（x,y＝自己的崗位；w＝作業時走到車旁的位置，單位是格子） ---------- */
const crew=[
  {id:"eng",name:"賽車工程師",role:"總指揮・分派任務",x:8,y:30,w:[8,30],c:"#eef0f3",keys:[]},
  {id:"cal",name:"行程技師",role:"Google 行事曆",x:12,y:7,w:[17,9],c:"#4aa3ff",keys:["行程","會議","行事曆","明天","約","今天有什麼"]},
  {id:"mail",name:"信件技師",role:"Gmail 提醒",x:13,y:28,w:[17,26],c:"#47e08c",keys:["信","郵件","gmail","mail","回覆"]},
  {id:"stock",name:"策略技師",role:"台股・美股簡報",x:31,y:7,w:[29,9],c:"#f2c230",keys:["股","台股","美股","收盤","大盤","投資","etf","外資","投信","法人","本益比","營收","殖利率","財報","融資"]},
  {id:"shop",name:"電商技師",role:"蝦皮（待上線）",x:35,y:29,w:[33,26],c:"#c27bff",keys:["蝦皮","訂單","商品","賣場","出貨"],off:true},
  {id:"crawl",name:"爬蟲技師",role:"每小時抓新聞",x:27,y:32,w:[27,26],c:"#ff7a45",keys:["爬","網站","新聞","抓"]}
];
/* 狀態：idle 待命 / busy 作業中 / error 故障 / off 未上線
   meta：status.json 帶來的細節（task 正在做什麼、since 開始時間、last_done、last_msg） */
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state={},meta={},STUCK_MIN=40;
crew.forEach(m=>{state[m.id]=m.off?"off":"idle";meta[m.id]={};m.px=m.x;m.py=m.y;m.moving=false});
const minsSince=iso=>iso?(Date.now()-new Date(iso))/60000:null;
const isStuck=id=>state[id]==="busy"&&minsSince(meta[id].since)>STUCK_MIN;
/* 作業中走到賽車旁的工位，其他狀態回到自己的崗位 */
const goal=m=>state[m.id]==="busy"?m.w:[m.x,m.y];

/* ---------- 名牌＋頭上泡泡（HTML，跟著 3D 位置移動） ---------- */
crew.forEach(m=>{
  const b=document.createElement("button");b.className="lbl";b.id="l-"+m.id;b.style.setProperty("--c",m.c);
  const short=m.id==="eng"?"工程師":m.name.replace("技師","");
  b.innerHTML=`<span class="nm"><span class="lg"></span><span class="sm"></span></span><span class="tk"></span>`;b.querySelector(".lg").textContent=m.name;b.querySelector(".sm").textContent=short;
  if(m.id==="eng")b.style.transform="translate(-50%,0)";
  b.onclick=()=>showDetail(m.id);
  stage.append(b);
});
const dogBtn=document.createElement("button");dogBtn.className="dog";dogBtn.setAttribute("aria-label","車庫狗 Box");
dogBtn.onclick=()=>petDog();stage.append(dogBtn);
function petDog(){log("車庫狗 Box",skyMode()==="night"?"呼…呼…（睡著了，維修區一切正常）":"汪！巡完一圈，維修區一切正常。");dogJump=1;if(still)draw()}
let dogJump=0;

let draw=()=>{};      // 重畫一次（減少動態模式用）
let shot4k=null;      // 4K 截圖

function init3d(){
  if(!window.THREE)throw new Error("3D 程式庫沒有載入");
  const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,powerPreference:"high-performance"});
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
  renderer.physicallyCorrectLights=false;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0x0d0e12,24,40);
  const ANISO=renderer.capabilities.getMaxAnisotropy();

  /* ---------- 小工具 ---------- */
  const C=h=>new THREE.Color(h).convertSRGBToLinear();
  const std=(h,r=.6,m=0,o={})=>new THREE.MeshStandardMaterial({color:C(h),roughness:r,metalness:m,...o});
  const paint=(h,o={})=>new THREE.MeshPhysicalMaterial({color:C(h),roughness:.3,metalness:.25,clearcoat:1,clearcoatRoughness:.06,...o});
  const glow=h=>new THREE.MeshBasicMaterial({color:C(h),toneMapped:false});
  function mk(geo,mat,x=0,y=0,z=0,parent=scene,shadow=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=shadow;parent.add(m);return m}
  const bx=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
  function rrShape(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;r=Math.min(r,w/2,h/2);
    s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
  function rbox(w,h,d,r=.02){r=Math.min(r,w*.45,h*.45,d*.45);
    const g=new THREE.ExtrudeGeometry(rrShape(w-2*r,h-2*r,r),{depth:d-2*r,bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:3,curveSegments:4});
    g.translate(0,0,-(d-2*r)/2);return g}
  function capsule(r,len,seg=8,rad=16){const p=[];
    for(let i=0;i<=seg;i++){const a=-Math.PI/2+i/seg*Math.PI/2;p.push(new THREE.Vector2(Math.max(0,r*Math.cos(a)),-len/2+r*Math.sin(a)))}
    for(let i=0;i<=seg;i++){const a=i/seg*Math.PI/2;p.push(new THREE.Vector2(Math.max(0,r*Math.cos(a)),len/2+r*Math.sin(a)))}
    return new THREE.LatheGeometry(p,rad)}
  function rod(a,b,r,mat,parent=scene){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);
    const m=mk(new THREE.CylinderGeometry(r,r,d.length(),8),mat,0,0,0,parent);m.position.copy(A).add(B).multiplyScalar(.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return m}
  function ctex(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");fn(g,w,h);
    const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=ANISO;t.userData={g,c,w,h};return t}
  function noise(g,w,h,n,a){for(let i=0;i<n;i++){g.fillStyle=Math.random()<.5?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a*1.4})`;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2)}}
  const W=([gx,gy])=>[(gx+1)*CELL,(gy+1)*CELL];   // 技師格子 → 公尺

  /* ---------- 反光用的環境（模擬室內燈箱） ---------- */
  const env=new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(24,10,24),new THREE.MeshBasicMaterial({color:new THREE.Color(.09,.1,.12),side:THREE.BackSide})));
  [[0,4.8,0,14,.2,3,5],[0,4.8,-6,14,.2,1.5,3],[-11.8,3,0,.2,3,10,1.4],[11.8,2.5,4,.2,2,8,.9]].forEach(([x,y,z,w,h,d,k])=>{
    const p=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:new THREE.Color(k,k,k*1.05)}));p.position.set(x,y,z);env.add(p)});
  const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(env,.03).texture;pm.dispose();

  /* ---------- 地板（環氧樹脂地坪＋維修區標線） ---------- */
  const S=coarse?220:340;

function todayStats(m){
  const t=todayTag(),r=radioOf(m).filter(x=>String(x.msg).startsWith(t));
  return {runs:r.length,errs:r.filter(x=>String(x.msg).includes("⚠")).length};
}
/* 下次出勤：照 GitHub 排程推算（GitHub 偶爾會晚幾分鐘） */
function nextRun(id){
  const now=Date.now();
  if(id==="crawl"){const d=new Date(now);d.setUTCMinutes(7,0,0);if(d<=now)d.setUTCHours(d.getUTCHours()+1);return d}
  if(id!=="stock")return null;
  let t=Math.ceil(now/900000)*900000;
  for(let i=0;i<7*96;i++,t+=900000){
    const d=new Date(t),wd=d.getUTCDay(),h=d.getUTCHours();
    if(wd<1||wd>5||!(h<=7||(h>=12&&h<=22)))continue;
    const tw=tpParts(d,"Asia/Taipei"),us=tpParts(d,"America/New_York");
    const inWin=(p,a,b)=>!["Sat","Sun"].includes(p.weekday)&&(+p.hour*60+ +p.minute)>=a&&(+p.hour*60+ +p.minute)<b;
    if(inWin(tw,480,960)||inWin(us,480,1080))return d;
  }
  return null;
}
function showDetail(id){
  const m=crew.find(c=>c.id===id);if(!m)return;openId=id;
  const box=document.getElementById("detail"),mt=meta[id],[cls,txt]=stTag(id),nx=nextRun(id),s=todayStats(m);
  document.getElementById("roster").hidden=true;box.hidden=false;
  const hist=radioOf(m).slice(-6).reverse();
  box.innerHTML=`<h3><span class="sw" style="--c:${m.c}"></span>${esc(m.name)} <span class="st ${cls}">${txt}</span></h3>
    <dl>
      <dt>負責</dt><dd>${esc(m.role)}</dd>
      ${state[id]==="busy"?`<dt>正在做</dt><dd>${esc(mt.task||"作業中")}（${agoTxt(mt.since)}開始）</dd>`:""}
      <dt>上次完成</dt><dd>${mt.last_done?agoTxt(mt.last_done)+"："+esc(mt.last_msg||""):"還沒有紀錄"}</dd>
      <dt>下次出勤</dt><dd>${nx?"約 "+hm(nx):(m.off?"尚未上線":"網頁派工時")}</dd>
      <dt>今日</dt><dd>出勤 ${s.runs} 次${s.errs?`，<span class="st error">故障 ${s.errs} 次</span>`:"，沒有故障"}</dd>
    </dl>
    ${state[id]==="error"?'<p class="note">處理方式：到 GitHub → Actions 打開最近一次紅色 ✕ 的紀錄，截圖給 Claude 看。下次成功出勤會自動恢復。</p>':""}
    ${isStuck(id)?'<p class="note">超過 40 分鐘沒回報，可能卡住或排程被 GitHub 延後。可到 GitHub → Actions 看是否還在跑。</p>':""}
    <div class="hist">${hist.length?hist.map(x=>`<p>${esc(x.msg)}</p>`).join(""):'<p class="note">還沒有通訊紀錄。</p>'}</div>
    <button id="back">‹ 回到全員</button>`;
  document.getElementById("back").onclick=()=>{openId=null;box.hidden=true;document.getElementById("roster").hidden=false};
}

/* ---------- 賽道看板：開盤旗號＋今日統計＋資料新鮮度 ---------- */
let lastUpdated=null;
function mktOpen(tz,a,b){const p=tpParts(new Date(),tz),t=+p.hour*60+ +p.minute;return !["Sat","Sun"].includes(p.weekday)&&t>=a&&t<b}
function renderStrip(){
  const tw=mktOpen("Asia/Taipei",540,810),us=mktOpen("America/New_York",570,960);
  let runs=0,errs=0;crew.forEach(m=>{const s=todayStats(m);runs+=s.runs;errs+=s.errs});
  const busy=crew.filter(m=>state[m.id]==="busy").length,age=minsSince(lastUpdated);
  const stale=age!=null&&age>180;
  document.getElementById("strip").innerHTML=
    `<span><i class="flag ${tw?"g":"n"}"></i>台股 <b>${tw?"開盤中":"休市"}</b></span>`+
    `<span><i class="flag ${us?"g":"n"}"></i>美股 <b>${us?"開盤中":"休市"}</b></span>`+
    `<span>作業中 <b>${busy}</b></span>`+
    `<span>今日出勤 <b>${runs}</b></span>`+
    `<span${errs?' class="alert"':""}>故障 <b>${errs}</b></span>`+
    `<span${stale?' class="alert"':""}>後台回報 <b>${lastUpdated?agoTxt(lastUpdated):"--"}</b>${stale?"（超過 3 小時，請看 GitHub Actions）":""}</span>`;
  const h=+tpParts(new Date(),"Asia/Taipei").hour;
  stage.classList.toggle("night",h>=19||h<6);stage.classList.toggle("day",h>=6&&h<19);
}

/* ---------- 音效：任務完成時叮一聲（預設關閉） ---------- */
let soundOn=false,actx=null;
try{soundOn=localStorage.getItem("pg_sound")==="1"}catch(e){}
const sBtn=document.getElementById("sound");
function paintSound(){sBtn.textContent="音效 "+(soundOn?"開":"關");sBtn.setAttribute("aria-pressed",soundOn)}
sBtn.onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("pg_sound",soundOn?"1":"0")}catch(e){}paintSound();if(soundOn)chime()};
paintSound();
function chime(bad){
  if(!soundOn)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    (bad?[330,220]:[660,990]).forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=f;
      const t=actx.currentTime+i*.12;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.12)})}catch(e){}
}
const radio=document.getElementById("radio");
/* ---------- 通訊紀錄雲端同步 ----------
   任務對話存在 Cloudflare 後台（電腦、手機看到同一份）；連不上時先存在這台裝置，之後自動補傳 */
const CHAT_KEY="pg_chat",PEND_KEY="pg_chat_pending";
let chatSeen=0,syncing=false;
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const storedPass=()=>{try{return localStorage.getItem("pg_pass")}catch(e){return null}};
async function api(body){
  const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,passcode:storedPass()})});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.status);return d;
}
function nowStamp(){const n=new Date(),f=o=>n.toLocaleString("zh-TW",{...o,hour12:false,timeZone:"Asia/Taipei"});
  return f({month:"2-digit",day:"2-digit"})+" "+f({hour:"2-digit",minute:"2-digit"})}
function chat(who,msg,cls=""){
  log(who,msg,cls);
  const item={who,msg,cls,t:nowStamp()};
  const c=lsGet(CHAT_KEY,[]);c.push(item);lsSet(CHAT_KEY,c.slice(-100));
  const p=lsGet(PEND_KEY,[]);p.push(item);lsSet(PEND_KEY,p.slice(-50));
  flushChat();
}
async function flushChat(){
  if(!WORKER_URL||!storedPass()||syncing)return;
  const p=lsGet(PEND_KEY,[]);if(!p.length)return;
  syncing=true;
  try{const d=await api({action:"append",items:p.slice(0,20)});lsSet(PEND_KEY,lsGet(PEND_KEY,[]).slice(Math.min(p.length,20)));
    if(d.last)chatSeen=Math.max(chatSeen,d.last)}catch(e){}
  syncing=false;
  if(lsGet(PEND_KEY,[]).length&&chatSeen)setTimeout(flushChat,1000);
}
async function pullChat(first){
  if(!WORKER_URL||!storedPass()){if(first)lsGet(CHAT_KEY,[]).forEach(x=>log(x.who,x.msg,x.cls,x.t));return}
  try{
    const d=await api({action:"history",after:chatSeen});
    (d.items||[]).forEach(x=>{if(x.id>chatSeen){log(x.who,x.msg,x.cls,x.t);chatSeen=x.id}});
    if(first&&!(d.items||[]).length){            // 雲端還是空的：把這台裝置的舊紀錄搬上去
      const local=lsGet(CHAT_KEY,[]);local.forEach(x=>log(x.who,x.msg,x.cls,x.t));
      if(local.length&&!lsGet(PEND_KEY,[]).length)lsSet(PEND_KEY,local.slice(-50));
    }
  }catch(e){if(first)lsGet(CHAT_KEY,[]).forEach(x=>log(x.who,x.msg,x.cls,x.t))}
}
function log(who,msg,cls="",when){
  const t=when||new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,timeZone:"Asia/Taipei"});
  const p=document.createElement("p");p.innerHTML=`<span class="t">${t}</span> <span class="who">${who}</span> › <span class="${cls}"></span>`;
  p.lastElementChild.textContent=msg;radio.prepend(p);
}
/* ---------- 真正的任務：交給 Cloudflare 小後台 → Claude ----------
   WORKER_URL 填上後台網址就會啟用；空白時維持原本的示範模式 */
const WORKER_URL="https://pit-garage.j1577957.workers.dev";
function passcode(reset){
  let p=null;try{if(reset)localStorage.removeItem("pg_pass");p=localStorage.getItem("pg_pass")}catch(e){}
  if(!p){p=(prompt("請輸入指揮站通關密碼")||"").trim();if(p)try{localStorage.setItem("pg_pass",p)}catch(e){}}
  return p;
}
const localBusy=new Set();   // 正在處理網頁任務的技師，不被 status.json 覆蓋
async function dispatch(q,target){
  const who=target?target:crew[0];localBusy.add(who.id);
  if(target){chat("賽車工程師",`Box, box！交給${target.name}。`)}
  state.eng=target?"idle":"busy";state[who.id]="busy";meta[who.id]={...meta[who.id],task:"網頁任務："+q.slice(0,14),since:new Date().toISOString()};render();
  let pass=passcode(false);
  try{
    if(!pass)throw new Error("沒有輸入通關密碼，任務取消。");
    let r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:q,crew:who.id,passcode:pass})});
    if(r.status===401){pass=passcode(true);if(!pass)throw new Error("通關密碼錯誤，任務取消。");
      r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:q,crew:who.id,passcode:pass})});}
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||("後台錯誤 "+r.status));
    chat(d.who||who.name,d.reply,"done");chime();
    if(!chatSeen)pullChat(false);
  }catch(e){chat(who.name,"⚠️ "+e.message)}
  localBusy.delete(who.id);state[who.id]="idle";state.eng="idle";render();
}
document.getElementById("send").onclick=()=>{
  const q=task.value.trim();if(!q){task.focus();return}
  const low=q.toLowerCase(),target=crew.find(m=>m.keys.some(k=>low.includes(k)));
  if(WORKER_URL){
    chat("你",q);
    task.value="";
    if(target&&target.off){chat("賽車工程師",`這是${target.name}的工作，但他還沒上線，先記下來。`);return}
    dispatch(q,target);return;
  }
  log("你",q);
  state.eng="busy";render();
  setTimeout(()=>{
    state.eng="idle";
    if(!target){log("賽車工程師","收到，這題我自己處理，分析中。");state.eng="busy";render();
      setTimeout(()=>{state.eng="idle";log("賽車工程師","分析完成（示範）。","done");render()},2200);return}
    if(target.off){log("賽車工程師",`這是${target.name}的工作，但他還沒上線，先記下來。`);render();return}
    log("賽車工程師",`Box, box！交給${target.name}。`);state[target.id]="busy";render();
    setTimeout(()=>{state[target.id]="idle";log(target.name,"任務完成，結果已回報（示範）。","done");render()},2800);
  },900);
  task.value="";
};
document.getElementById("clear").onclick=()=>{task.value="";task.focus()};
function tick(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Taipei"})}
tick();setInterval(tick,30000);

/* ---------- 對外接口：讓後端/Agent 更新畫面 ----------
   pitGarage.setStatus("stock","busy")   狀態: idle 待命 / busy 作業中 / off 未上線
   pitGarage.log("策略技師","台積電站上月線")
   或在同資料夾放 status.json，頁面每 60 秒自動讀取：
   {"crew":{"stock":"busy","crawl":"idle"},"radio":[{"who":"爬蟲技師","msg":"抓到 3 則新聞"}]}
*/
window.pitGarage={
  setStatus(id,st,task){if(id in state){state[id]=st;meta[id]=st==="busy"?{...meta[id],task:task||"",since:new Date().toISOString()}:meta[id];render()}},
  log(who,msg){log(who,msg,"done")}
};
let seen=0;
async function pull(){
  try{
    const r=await fetch("status.json?t="+Date.now());if(!r.ok)return;
    const d=await r.json();
    for(const id in (d.crew||{}))if(id in state&&!localBusy.has(id)){state[id]=d.crew[id];meta[id]=(d.meta||{})[id]||{}}
    lastUpdated=d.updated||lastUpdated;
    const rl=d.radio||[],key=(x,i)=>x.id??i+1;radioAll=rl;
    let fresh=[];
    rl.forEach((x,i)=>{if(key(x,i)>seen){log(x.who,x.msg,String(x.msg).includes("⚠")?"":"done");fresh.push(x)}});
    if(seen&&fresh.length)chime(fresh.some(x=>String(x.msg).includes("⚠")));
    if(rl.length)seen=Math.max(seen,...rl.map(key));
    render();
  }catch(e){}
}
pullChat(true).then(()=>{flushChat();setInterval(()=>{pullChat(false);flushChat()},60000)});
pull();setInterval(pull,60000);
render();setInterval(render,60000);log("賽車工程師","Radio check，全員就位。點技師名牌可以看他的工作紀錄。");

/* ---------- 股票看板：讀 data/latest.json、data/signals.json ---------- */
let stkData={},stkMkt="tw";
function renderStocks(){
  const m=stkData[stkMkt],box=document.getElementById("stkTable");
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===stkMkt));
  if(!m){box.innerHTML='<p class="note">還沒有資料，等策略技師第一次出勤。</p>';document.getElementById("stkTime").textContent="--";return}
  const ph={pre:"盤前",intraday:"盤中",post:"盤後"}[m.mode.split("_")[1]]||"";
  document.getElementById("stkTime").textContent=m.time.slice(5)+" "+ph;
  box.innerHTML='<table class="stk"><thead><tr><th>股票</th><th>價格</th><th>漲跌</th><th>初篩</th></tr></thead><tbody>'+
    m.stocks.map(s=>{
      if(s.error)return `<tr><td>${esc(s.name)}<br><span class="sym">${esc(s.symbol)}</span></td><td colspan="3" class="sym">抓不到資料</td></tr>`;
      const c=s.change_pct>0?"up":s.change_pct<0?"dn":"";
      const tag=s.candidate?'<span class="tag go">★ 候選</span>':(s.blockers&&s.blockers.length?'<span class="tag" title="'+esc(s.blockers.join("、"))+'">✕</span>':`<span class="tag">${s.score} 分</span>`);
      return `<tr><td>${esc(s.name)}<br><span class="sym">${esc(s.symbol)}</span></td><td class="${c}">${s.price}</td><td class="${c}">${s.change_pct>0?"+":""}${s.change_pct}%</td><td>${tag}</td></tr>`;
    }).join("")+'</tbody></table>';
}
async function pullStocks(){
  try{
    const [a,b]=await Promise.all(["latest","signals"].map(n=>fetch("data/"+n+".json?t="+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)));
    stkData=a||{}; if(!stkData.tw&&stkData.us)stkMkt="us"; renderStocks();
    const v=(b||[]).slice(0,5),vb=document.getElementById("stkVerdicts");
    vb.innerHTML=v.length?'<p class="label" style="margin:0"><span>判斷 agent 最新結論</span><span></span></p>'+v.map(s=>{const j=s.judge||{};
      return `<p><span class="vd ${esc(j.verdict)}">${esc(j.verdict)}</span> ${esc(s.name)} ${s.price} <span class="sym">${esc(s.time.slice(5))}</span><br><span class="role">${esc(j.summary)}</span></p>`}).join(""):"";
  }catch(e){}
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{stkMkt=b.dataset.m;renderStocks()});
pullStocks();setInterval(pullStocks,60000);

/* ---------- 利多利空小欄位：讀 data/news.json（爬蟲技師每小時更新） ---------- */
let news={},nMkt="tw",nFil="all";
const BULL=["利多","偏多"],BEAR=["利空","偏空"];
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/60000);return m<60?m+"分前":m<1440?Math.floor(m/60)+"時前":Math.floor(m/1440)+"天前"};
function renderNews(){
  document.querySelectorAll("#ntabs button").forEach(b=>b.classList.toggle("on",b.dataset.m?b.dataset.m===nMkt:b.dataset.f===nFil));
  const all=news[nMkt]||[],box=document.getElementById("nlist");
  document.getElementById("newsTime").textContent=news.updated?news.updated.slice(5):"--";
  const r30=all.slice(0,30),b=r30.filter(n=>BULL.includes(n.label)).length,r=r30.filter(n=>BEAR.includes(n.label)).length;
  const mood=b-r>=3?'<span class="up">偏多 ▲</span>':r-b>=3?'<span class="dn">偏空 ▼</span>':"中性 ■";
  document.getElementById("mood").innerHTML=all.length?`近 30 則 <span class="up">多 ${b}</span> ／ <span class="dn">空 ${r}</span> → 氣氛 ${mood}`:"";
  const list=all.filter(n=>nFil==="all"?(BULL.includes(n.label)||BEAR.includes(n.label)):(nFil==="bull"?BULL:BEAR).includes(n.label)).slice(0,20);
  if(!list.length){box.innerHTML=`<p class="note">${all.length?"目前沒有這類消息。":"還沒有新聞，爬蟲技師每小時會出勤一次。"}</p>`;return}
  box.innerHTML=list.map(n=>{const c=BULL.includes(n.label)?"bull":"bear";
    return `<div class="nw"><span class="nt ${c} ${Math.abs(n.score)>=3?"strong":""}">${esc(n.label)}</span>
      <div><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a><br><span class="role">${esc(n.source)} ・ ${ago(n.time)}</span></div></div>`}).join("");
}
document.querySelectorAll("#ntabs button").forEach(b=>b.onclick=()=>{if(b.dataset.m)nMkt=b.dataset.m;else nFil=b.dataset.f;renderNews()});
async function pullNews(){try{const r=await fetch("data/news.json?t="+Date.now());if(r.ok){news=await r.json();renderNews()}}catch(e){}}
pullNews();setInterval(pullNews,300000);
</script>
